services:
  scraper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - SCRAPE_URL=${SCRAPE_URL}
      - SCRAPE_DAYS=${SCRAPE_DAYS:-28}
      - ACTUALLY_SAVED_DAYS_END=${ACTUALLY_SAVED_DAYS_END:-0}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./output:/app/output
